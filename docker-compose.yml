version: '3.8'

services:
  backend:
    build: ./backend
    container_name: crm-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - crm-data:/app/data
      - crm-uploads:/app/uploads
      - crm-logs:/app/logs
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - LLM_API_BASE=${LLM_API_BASE:-http://10.200.100.74:8000/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-qwen2.5:32b}
      - DB_PATH=/app/data/crm.db
    networks:
      - crm-net

  frontend:
    build: ./frontend
    container_name: crm-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - crm-net

networks:
  crm-net:
    driver: bridge

volumes:
  crm-data:
  crm-uploads:
  crm-logs:
