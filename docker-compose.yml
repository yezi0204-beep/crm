version: '3.8'

services:
  backend:
    image: crm-backend:latest
    container_name: crm-backend
    ports:
      - "5000:5000"
    volumes:
      # 绿联 UGOS Pro 存储路径：/share/DockerData/crm/ 下挂载数据库和上传文件
      # 部署时请在 NAS 文件管理器中提前创建 crm/data 和 crm/uploads 目录
      - /share/DockerData/crm/data/crm_app.db:/app/crm_app.db
      - /share/DockerData/crm/uploads:/app/uploads
    environment:
      - FLASK_ENV=production
      - DB_PATH=/app/crm_app.db
      - UPLOAD_DIR=/app/uploads/contracts
      - SECRET_KEY=${SECRET_KEY:-crm_secret_key_2026}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_API_BASE=${LLM_API_BASE:-https://api.deepseek.com/v1}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - TZ=Asia/Shanghai
    restart: unless-stopped
    networks:
      - crm-network

  frontend:
    image: crm-frontend:latest
    container_name: crm-frontend
    ports:
      - "8088:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - crm-network

networks:
  crm-network:
    driver: bridge
