version: '3.8'

services:
  backend:
    image: crm-backend:latest
    ports:
      - "5000:5000"
    volumes:
      - /share/CACHEDEV1_DATA/crm/data/crm_app.db:/app/crm_app.db
      - /share/CACHEDEV1_DATA/crm/uploads:/app/uploads
    environment:
      - FLASK_ENV=production
      - DB_PATH=/app/crm_app.db
      - UPLOAD_DIR=/app/uploads
      - SECRET_KEY=${SECRET_KEY:-crm_secret_key_2026}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_API_BASE=https://api.deepseek.com/v1
      - LLM_MODEL=deepseek-chat
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
    restart: unless-stopped
    networks:
      - crm-network

  frontend:
    image: crm-frontend:latest
    ports:
      - "8088:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - crm-network

networks:
  crm-network:
    driver: bridge